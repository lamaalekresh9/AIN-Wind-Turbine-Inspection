{% from "macros.html" import brand_mark %}
<header class="pub-nav" {% if light %}style="position:static;background:var(--navy-2)"{% endif %}>
  <a class="brand" href="{{ url_for('main.home') }}">{{ brand_mark() }}<span class="brand-name">Ain</span><span class="brand-ar">عين</span></a>
  <nav>
    <a class="hide-sm" href="{{ url_for('main.home') }}#how">How it works</a>
    <a class="hide-sm" href="{{ url_for('main.home') }}#features">Features</a>
    <a class="hide-sm" href="{{ url_for('main.help_center') }}">Help</a>
    {% if current_user.is_authenticated %}
      <a class="btn btn-signal btn-sm" href="{{ url_for('dashboard.index') }}">Open dashboard</a>
    {% else %}
      <a href="{{ url_for('auth.login') }}">Sign in</a>
      <a class="btn btn-signal btn-sm" href="{{ url_for('auth.signup') }}">Create account</a>
    {% endif %}
  </nav>
</header>
